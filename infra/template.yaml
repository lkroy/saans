AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Saans — school air-safety backend. FastAPI on Lambda (via Mangum) behind an
  HTTP API, DynamoDB school store, daily 05:30 IST bulletin schedule, SNS alerts.

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Gemini API key for the Strands agent. Optional — without it the agent
      endpoint runs in transparent rule-based fallback mode.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  # ---------------------------------------------------------- HTTP API
  # Explicit ApiGatewayV2 resources (not SAM magic): Api + Lambda proxy
  # integration + greedy route + $default stage with auto-deploy.
  SaansApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: saans-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  SaansIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SaansApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SaansFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  SaansRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SaansApi
      RouteKey: "ANY /{proxy+}"
      Target: !Join ["/", ["integrations", !Ref SaansIntegration]]

  SaansDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: SaansRoute
    Properties:
      ApiId: !Ref SaansApi

  SaansStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SaansApi
      StageName: $default
      AutoDeploy: true
      DeploymentId: !Ref SaansDeployment

  SaansApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SaansFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SaansApi}/*/*/*"

  # ---------------------------------------------------------- Lambda
  SaansFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./build/backend/
      Handler: app.handler.handler
      Environment:
        Variables:
          SCHOOLS_TABLE: !Ref SchoolsTable
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          GEMINI_API_KEY: !Ref GeminiApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchoolsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sns:Subscribe
                - sns:ListSubscriptionsByTopic
              Resource: !Ref AlertsTopic
      Events:
        DailyBulletin:
          Type: ScheduleV2
          Properties:
            Description: Morning school bulletins, 05:30 Asia/Kolkata daily
            ScheduleExpression: "cron(30 5 * * ? *)"
            ScheduleExpressionTimezone: "Asia/Kolkata"
            FlexibleTimeWindow:
              Mode: "OFF"
            # The handler branches on the scheduler event source and fans out
            # bulletins for every registered school.

  # ---------------------------------------------------------- storage
  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saans-schools
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------------------------------------------------------- alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: saans-alerts

Outputs:
  ApiUrl:
    Description: Base URL of the Saans HTTP API
    Value: !Sub "https://${SaansApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  SchoolsTableName:
    Value: !Ref SchoolsTable
  AlertsTopicArn:
    Value: !Ref AlertsTopic
